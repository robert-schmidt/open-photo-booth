name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
# The installers are built on the maintainer's computer (the camera SDKs and the face swap models can't be in the
# repository) and added to the draft this makes: see Releasing in the README.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes = this version's CHANGELOG section + download/donation footer.
          awk -v v="$version" '/^## \[/ { p = index($0, "[" v "]") > 0; next } /^\[[^]]+\]: / { next } p' CHANGELOG.md > notes.md
          sed "s/{version}/$version/g" .github/release-footer.md >> notes.md
          gh release create "$GITHUB_REF_NAME" --draft --repo "$GITHUB_REPOSITORY" --title "Open Photo Booth $GITHUB_REF_NAME" --notes-file notes.md
