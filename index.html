<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'">
<title>Open Photo Booth</title>
<style>
  :root { color-scheme: dark; --accent: #ff4f6d; --panel: #1b1b1f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; user-select: none; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #video.mirror { transform: scaleX(-1); }
  .screen { position: fixed; inset: 0; display: none; }
  body[data-screen="attract"] #attract, body[data-screen="capture"] #capture, body[data-screen="review"] #review { display: grid; }

  #attract { place-items: end center; padding-bottom: 10vh; text-align: center; cursor: pointer;
             background: linear-gradient(to top, rgba(0,0,0,.75), transparent 55%); }
  #attract h1 { margin: 0 0 .5em; font-size: clamp(2rem, 6vw, 5rem); text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  .cta { display: inline-block; font-size: clamp(1.2rem, 3vw, 2.2rem); padding: .8em 2.2em; border-radius: 999px;
         background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  #capture { place-items: center; }
  #status { position: absolute; top: 4vh; width: 100%; text-align: center; font-size: 2.2rem; text-shadow: 0 2px 10px #000; }
  #count { font-size: 40vh; font-weight: 800; text-shadow: 0 0 60px rgba(0,0,0,.6); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash .6s ease-out; }
  @keyframes flash { from { opacity: 1; } }

  #review { grid-template-rows: minmax(0, 1fr) auto; gap: 3vh; padding: 4vh; background: rgba(0,0,0,.92); }
  #result { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 30px rgba(0,0,0,.7)); }
  .actions { display: flex; gap: 1.5rem; justify-content: center; }
  button { font: inherit; font-size: 1.4rem; padding: .8em 1.8em; border: 0; border-radius: 999px; background: #333; color: #fff; cursor: pointer; }
  button.primary { background: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }

  #corner { position: fixed; top: 0; right: 0; width: 80px; height: 80px; z-index: 5; }
  #toast { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); padding: .8em 1.4em; border-radius: 12px;
           background: rgba(20,20,20,.92); font-size: 1.1rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 10; }
  #toast.on { opacity: 1; }

  dialog { width: min(760px, 94vw); max-height: 92vh; border: 0; border-radius: 16px; padding: 0; background: var(--panel); color: #fff; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog form { padding: 24px 28px; }
  dialog h2 { margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: max-content 1fr; gap: 12px 16px; align-items: center; }
  .grid label { color: #bbb; }
  .row { display: flex; gap: 8px; }
  .row > :first-child { flex: 1; min-width: 0; }
  input, select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; width: 100%; }
  input[type="checkbox"] { width: 22px; height: 22px; justify-self: start; }
  dialog button { font-size: 1rem; padding: .6em 1.2em; }
  .footer { display: flex; gap: 8px; margin-top: 24px; }
  .footer .spacer { flex: 1; }
</style>
</head>
<body data-screen="attract">
  <video id="video" autoplay muted playsinline></video>

  <section id="attract" class="screen">
    <div><h1 id="eventTitle"></h1><span class="cta">Touch to start</span></div>
  </section>
  <section id="capture" class="screen"><div id="status"></div><div id="count"></div></section>
  <section id="review" class="screen">
    <img id="result" alt="Your photos">
    <div class="actions">
      <button id="retake">Retake</button>
      <button id="print">Print</button>
      <button id="done" class="primary">Done</button>
    </div>
  </section>
  <div id="flash"></div>
  <div id="corner" title="Hold for settings"></div>
  <div id="toast" role="status"></div>

  <dialog id="settings">
    <form id="settingsForm" method="dialog">
      <h2>Settings</h2>
      <div class="grid">
        <label for="eventName">Event name</label><input id="eventName" name="eventName">
        <label for="cameraId">Camera</label><select id="cameraId" name="cameraId"></select>
        <label for="mirror">Mirror camera</label><input id="mirror" name="mirror" type="checkbox">
        <label for="templateId">Layout</label>
        <div class="row"><select id="templateId" name="templateId"></select><button type="button" id="import">Import…</button></div>
        <label for="filter">Filter</label><select id="filter" name="filter"></select>
        <label for="countdown">Countdown (s)</label><input id="countdown" name="countdown" type="number" min="0" max="10">
        <label for="betweenShots">Pause between photos (s)</label><input id="betweenShots" name="betweenShots" type="number" min="0" max="10">
        <label for="reviewSeconds">Review screen (s)</label><input id="reviewSeconds" name="reviewSeconds" type="number" min="3" max="300">
        <label for="outputDir">Save photos to</label>
        <div class="row"><input id="outputDir" name="outputDir" readonly><button type="button" id="choose">Choose…</button></div>
        <label for="printer">Printer</label><select id="printer" name="printer"></select>
        <label for="copies">Copies</label><input id="copies" name="copies" type="number" min="1" max="10">
        <label for="autoPrint">Print automatically</label><input id="autoPrint" name="autoPrint" type="checkbox">
        <label for="print2up">Print strips 2-up (4×6)</label><input id="print2up" name="print2up" type="checkbox">
        <label for="kiosk">Fullscreen kiosk</label><input id="kiosk" name="kiosk" type="checkbox">
      </div>
      <div class="footer">
        <button type="button" id="openFolder">Open photos</button>
        <button type="button" id="quit">Quit</button>
        <span class="spacer"></span>
        <button value="cancel">Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="layout.js"></script>
  <script src="app.js"></script>
</body>
</html>
